<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Chat</title>
<link rel="manifest" id="manifest">
<style>
body { margin:0; font-family:monospace; background:#0f0f0f; color:#eee; display:flex; flex-direction:column; height:100vh;}
header{ text-align:center; padding:10px; border-bottom:1px solid #333; font-weight:bold;}
#chat{ flex:1; overflow-y:auto; padding:10px; white-space:pre-wrap;}
#bar{ display:flex; border-top:1px solid #333;}
input{ flex:1; background:#111; color:white; border:none; padding:10px; font-family:monospace;}
button{ background:#222; color:white; border:none; padding:10px;}
#install{ background:#0a84ff; border:none; color:white; padding:6px; cursor:pointer; display:none;}
#banner{ display:none; background:#0a84ff; color:white; padding:10px; text-align:center; font-weight:bold;}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>

<header>
========== CLASS CHAT ==========
<br>
<button id="install">Install App</button>
</header>

<div id="banner"></div>
<div id="chat"></div>

<div id="bar">
<input id="msg" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>

<script>
/* ===== CONFIGURE SERVER ===== */
const SERVER = "bug-free-spork-q7rpgjj49r6qf64g-8765.app.github.dev";
/* ============================ */

let ws;
let currentVersion = "1.0";
const chat = document.getElementById("chat");
const input = document.getElementById("msg");
const banner = document.getElementById("banner");

function add(msg){
    chat.textContent += msg + "\n";
    chat.scrollTop = chat.scrollHeight;
}

function showBanner(text){
    banner.textContent = text;
    banner.style.display = "block";
    setTimeout(()=>{banner.style.display="none"},10000); // hide after 10s
}

/* ===== WebSocket ===== */
function connectWS(){
    ws = new WebSocket(`wss://${SERVER}`);

    ws.onopen = () => add("Connected to server");

    ws.onmessage = e => {
        try {
            const data = JSON.parse(e.data);
            if(data.type === "version"){
                if(data.version !== currentVersion){
                    showBanner("New update available! Refresh to get latest version.");
                    currentVersion = data.version;
                }
            } else if(data.type === "announcement"){
                showBanner("Announcement: " + data.text);
            }
        } catch {
            add(e.data); // normal chat
        }
    };

    ws.onclose = () => {
        add("Disconnected. Reconnecting in 5s...");
        setTimeout(connectWS, 5000);
    };
}

connectWS();

function sendMsg(){
    if(input.value.trim()){
        ws.send(input.value);
        input.value="";
    }
}

input.addEventListener("keydown", e=>{
    if(e.key==="Enter") sendMsg();
});

/* ===== PWA Manifest ===== */
const manifest = {
  name: "Class Chat",
  short_name: "Chat",
  start_url: ".",
  display: "standalone",
  background_color: "#0f0f0f",
  theme_color: "#0f0f0f"
};
const manifestURL = "data:application/json," + encodeURIComponent(JSON.stringify(manifest));
document.getElementById("manifest").setAttribute("href", manifestURL);

let deferredPrompt;
const installBtn = document.getElementById("install");
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});
installBtn.onclick = async () => {
  deferredPrompt.prompt();
  deferredPrompt = null;
};

/* ===== Service Worker for caching & auto-update ===== */
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js")
    .then(reg=>console.log("SW registered",reg))
    .catch(err=>console.log("SW failed",err));
    // check for updates every 60s
    setInterval(()=>{
        navigator.serviceWorker.getRegistration().then(reg=>{
            if(reg) reg.update();
        });
    },60000);
}
</script>
</body>
</html>
