<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Class Chat</title>
<style>
body{margin:0;font-family:monospace;background:#0f0f0f;color:#eee;height:100vh;display:flex;flex-direction:column}
header{padding:8px;text-align:center;border-bottom:1px solid #333}
#status{font-size:12px;color:#0a84ff}
#chat{flex:1;overflow:auto;padding:10px}
#bar{display:flex;border-top:1px solid #333}
input{flex:1;background:#111;color:#fff;border:none;padding:10px}
button{background:#222;color:#fff;border:none;padding:10px}
.announce{color:#ffd700}
.offline{color:#ff5555}
</style>
</head>
<body>

<header>
CLASS CHAT  
<div id="status">Connecting...</div>
</header>

<div id="chat"></div>

<div id="bar">
<input id="msg" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>

<script>
const SERVER="bug-free-spork-q7rpgjj49r6qf64g-8765.app.github.dev";
let ws;
const chat=document.getElementById("chat");
const status=document.getElementById("status");
const input=document.getElementById("msg");

function add(t,cls=""){
  const d=document.createElement("div");
  d.textContent=t;
  if(cls) d.className=cls;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function connect(){
  ws=new WebSocket(`wss://${SERVER}`);

  ws.onopen=()=>status.textContent="🟢 Server Online";

  ws.onclose=()=>{
    status.textContent="🔴 Server Offline — reconnecting...";
    setTimeout(connect,3000);
  };

  ws.onmessage=e=>{
    if(e.data==="Username:"||e.data==="Password:"){
      ws.send(prompt(e.data));
    }
    else if(e.data.startsWith("[ANNOUNCEMENT]")){
      add(e.data,"announce");
    }
    else add(e.data);
  };
}

function send(){
  if(input.value.trim()){
    ws.send(input.value);
    input.value="";
  }
}

input.onkeydown=e=>{if(e.key==="Enter")send();}

connect();
</script>

</body>
</html>
